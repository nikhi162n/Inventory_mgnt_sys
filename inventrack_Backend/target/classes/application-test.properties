# Test Profile - Uses H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:inventrack_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.jwt.secret=TestSecretKeyForJWTTokenSigningInTestEnvironment2026
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
spring.mail.host=localhost
spring.mail.port=1025
logging.level.com.inventrack=DEBUG
